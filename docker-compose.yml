version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: innsync
      POSTGRES_PASSWORD: innsync
      POSTGRES_DB: innsync
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build: ./backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://innsync:innsync@postgres:5432/innsync
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:3001
    depends_on:
      - postgres
      - redis

  admin:
    build: ./admin
    ports:
      - '3001:80'
    environment:
      REACT_APP_API_URL: /api/v1
    depends_on:
      - backend

volumes:
  pgdata:
